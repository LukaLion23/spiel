<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="color-scheme"
        content="light">

    <meta
        name="supported-color-schemes"
        content="light">

    <meta
        name="theme-color"
        content="#eef3f8">

    <style>
        :root,
        html {
            color-scheme: only light !important;
            background-color: #eef3f8 !important;
        }
    </style>

    <script>
        document.documentElement.style.colorScheme =
            "only light";
    </script>

    <title>Kartenspiel – Tipp</title>

    <link
        rel="stylesheet"
        href="./style.css?v=56">
</head>

<body class="tip-page">

    <h1>Dein Tipp</h1>

    <main class="container">

        <p
            class="page-error"
            id="pageError"
            hidden>
        </p>

        <section class="panel tip-heading">
            <h2 id="roundTitle">
                Runde wird geladen …
            </h2>

            <p id="playerDisplay"></p>

            <p
                class="current-tip-player"
                id="currentTipPlayer">
            </p>
        </section>

        <section
            class="panel"
            id="tipPanel">

            <h2>Wie viele Stiche schaffst du?</h2>

            <label for="tipInput">
                Dein Tipp
            </label>

            <input
                id="tipInput"
                type="number"
                inputmode="numeric"
                min="0"
                step="1"
                value="0">

            <button
                id="submitTipButton"
                type="button">
                Tipp verbindlich speichern
            </button>

            <p id="tipStatus"></p>

        </section>

        <section class="panel">
            <h2>Deine Karten</h2>

            <div
                class="cards-grid"
                id="handArea">

                <p>
                    Handkarten werden geladen …
                </p>

            </div>
        </section>

        <section class="panel">
            <h2>Tipp-Reihenfolge</h2>

            <div id="tipOverview"></div>
        </section>

    </main>

    <script type="module">
        import("./tip.js?v=56")
            .catch(error => {
                console.error(error);

                const errorElement =
                    document.getElementById(
                        "pageError"
                    );

                errorElement.hidden = false;
                errorElement.textContent =
                    "Tippseite konnte nicht geladen werden: " +
                    error.message;
            });
    </script>

</body>
</html>

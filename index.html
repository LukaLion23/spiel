<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartenspiel</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Kartenspiel</h1>

    <div class="container">

        <input id="playerName" placeholder="Spielername">

        <button onclick="addPlayer()">
            Spieler hinzufügen
        </button>

        <ul id="playerList"></ul>

        <hr>

        <label>Karten pro Spieler:</label>

        <input
            id="cardsPerPlayer"
            type="number"
            min="1"
            max="20"
            value="5">

        <button onclick="startGame()">
            Spiel starten
        </button>

        <div id="game"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>

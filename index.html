<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Kartenspiel</title>

    <link rel="stylesheet" href="style.css">

    <!-- Deine bisherige lokale Spiellogik -->
    <script src="script.js" defer></script>

    <!-- Firebase-Online-Lobby -->
    <script type="module" src="firebase.js"></script>
</head>

<body>

    <h1>Kartenspiel</h1>

    <div class="container">

        <section class="panel" id="onlineLobby">
            <h2>Online-Spiel</h2>

            <label for="onlinePlayerName">
                Dein Name:
            </label>

            <input
                id="onlinePlayerName"
                type="text"
                maxlength="30"
                placeholder="Spielername"
                autocomplete="off">

            <div>
                <button
                    id="createRoomButton"
                    type="button"
                    disabled>
                    Spiel erstellen
                </button>
            </div>

            <hr>

            <label for="roomCodeInput">
                Spielcode:
            </label>

            <input
                id="roomCodeInput"
                type="text"
                minlength="6"
                maxlength="6"
                placeholder="ABC123"
                autocomplete="off">

            <button
                id="joinRoomButton"
                type="button"
                disabled>
                Spiel beitreten
            </button>

            <p id="firebaseStatus">
                Verbindung zu Firebase wird hergestellt …
            </p>

            <p id="activeRoomCode"></p>

            <h3>Spieler im Raum</h3>
            <ul id="onlinePlayerList"></ul>
        </section>

        <hr>

        <section class="panel">
            <h2>Spieler</h2>

            <input
                id="playerName"
                type="text"
                maxlength="30"
                placeholder="Spielername"
                autocomplete="off">

            <button
                type="button"
                onclick="addPlayer()">
                Spieler hinzufügen
            </button>

            <ul id="playerList"></ul>
        </section>

        <hr>

        <section class="panel">
            <h2>Runde</h2>

            <label for="cardsPerPlayer">
                Karten pro Spieler:
            </label>

            <input
                id="cardsPerPlayer"
                type="number"
                min="1"
                max="40"
                step="1"
                value="5">

            <button
                type="button"
                onclick="startGame()">
                Runde starten
            </button>

            <button
                type="button"
                onclick="finishGame()">
                Spiel beenden
            </button>

            <button
                type="button"
                onclick="resetGame()">
                Spiel zurücksetzen
            </button>
        </section>

        <hr>

        <section
            class="panel"
            id="messageArea">

            <h2>Status</h2>

            <p>
                Spiel noch nicht gestartet.
            </p>
        </section>

        <section
            class="panel"
            id="tipsArea">

            <h2>Tipps</h2>
        </section>

        <section
            class="panel"
            id="trickArea">

            <h2>Aktueller Stich</h2>
        </section>

        <section
            class="panel"
            id="game">

            <h2>Spielerhände</h2>
        </section>

        <section
            class="panel"
            id="scoreboard">

            <h2>Punktestand</h2>
        </section>


    </div>

</body>
</html>

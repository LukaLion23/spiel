<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartenspiel</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Kartenspiel</h1>

    <div class="container">

        <section class="panel">
            <h2>Spieler</h2>

            <input
                id="playerName"
                type="text"
                placeholder="Spielername">

            <button onclick="addPlayer()">
                Spieler hinzufügen
            </button>

            <ul id="playerList"></ul>
        </section>

        <hr>

        <section class="panel">
            <h2>Runde</h2>

            <label for="cardsPerPlayer">
                Karten pro Spieler:
            </label>

            <input
                id="cardsPerPlayer"
                type="number"
                min="1"
                max="20"
                value="5">

            <button onclick="startGame()">
                Spiel starten
            </button>
        </section>

        <hr>

        <section
            class="panel"
            id="messageArea">

            <h2>Status</h2>

            <p>
                Spiel noch nicht gestartet.
            </p>

        </section>

        <section
            class="panel"
            id="tipsArea">

            <h2>Tipps</h2>

        </section>

        <section
            class="panel"
            id="trickArea">

            <h2>Aktueller Stich</h2>

        </section>

        <section
            class="panel"
            id="game">

            <h2>Spielerhände</h2>

        </section>

        <section
            class="panel"
            id="scoreboard">

            <h2>Punktestand</h2>

        </section>

    </div>

    <script src="script.js"></script>

</body>
</html>

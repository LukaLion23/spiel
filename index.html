<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Kartenspiel – Eintritt</title>

    <link
        rel="stylesheet"
        href="./style.css?v=30">
</head>

<body>

    <h1>Online-Kartenspiel</h1>

    <main class="container">

        <section
            class="panel"
            id="entryPanel">

            <h2>Spiel erstellen oder beitreten</h2>

            <label for="onlinePlayerName">
                Dein Name:
            </label>

            <input
                id="onlinePlayerName"
                type="text"
                maxlength="30"
                placeholder="Spielername"
                autocomplete="off">

            <div class="button-row">
                <button
                    id="createRoomButton"
                    type="button"
                    disabled>
                    Neues Spiel erstellen
                </button>
            </div>

            <hr>

            <label for="roomCodeInput">
                Spielcode:
            </label>

            <input
                id="roomCodeInput"
                type="text"
                minlength="6"
                maxlength="6"
                placeholder="ABC123"
                autocomplete="off">

            <button
                id="joinRoomButton"
                type="button"
                disabled>
                Spiel beitreten
            </button>

            <p id="firebaseStatus">
                Verbindung zu Firebase wird hergestellt …
            </p>

        </section>

        <section
            class="panel"
            id="roomPanel"
            hidden>

            <h2>Warteraum</h2>

            <p id="activeRoomCode"></p>

            <h3>Spieler im Raum</h3>

            <ul id="onlinePlayerList"></ul>

            <p id="lobbyStatus">
                Warte auf weitere Spieler …
            </p>

            <div
                id="hostPanel"
                hidden>

                <hr>

                <h3>Spielleiter</h3>

                <label for="cardsPerPlayer">
                    Karten pro Spieler:
                </label>

                <input
                    id="cardsPerPlayer"
                    type="number"
                    min="1"
                    max="40"
                    step="1"
                    value="5">

                <button
                    id="startGameButton"
                    type="button">
                    Spiel starten
                </button>

            </div>

            <div class="button-row">
                <button
                    id="leaveRoomButton"
                    type="button">
                    Raum verlassen
                </button>
            </div>

        </section>

    </main>

    <script type="module">
        const statusElement =
            document.getElementById("firebaseStatus");

        if (statusElement) {
            statusElement.textContent =
                "Eintrittsseite wird geladen …";
        }

        import("./lobby.js?v=30")
            .catch(error => {
                console.error(error);

                if (statusElement) {
                    statusElement.textContent =
                        "lobby.js konnte nicht geladen werden: " +
                        error.message;
                }
            });
    </script>

</body>
</html>

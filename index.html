<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="darkreader-lock">

    <meta
        name="color-scheme"
        content="light">

    <meta
        name="supported-color-schemes"
        content="light">

    <meta
        name="theme-color"
        content="#eef3f8">

    <style>
        :root,
        html {
            color-scheme: only light !important;
            background-color: #eef3f8 !important;
        }
    </style>

    <script>
        document.documentElement.style.colorScheme =
            "only light";
    </script>

    <title>Kartenspiel – Spielräume</title>

    <link
        rel="stylesheet"
        href="./style.css?v=58">
</head>

<body class="entry-page">

    <h1>Online-Kartenspiel</h1>

    <main class="container">

        <section
            class="panel"
            id="entryPanel">

            <h2>Spielername</h2>

            <label for="playerName">
                Dein Name
            </label>

            <input
                id="playerName"
                type="text"
                maxlength="30"
                placeholder="Spielername"
                autocomplete="name">

            <section class="create-room-area">

                <h2>Neues Spiel erstellen</h2>

                <label for="roomName">
                    Name des Spielraums
                </label>

                <input
                    id="roomName"
                    type="text"
                    maxlength="40"
                    placeholder="Zum Beispiel: Freitagsspiel"
                    autocomplete="off">

                <button
                    id="createRoomButton"
                    type="button"
                    disabled>
                    Spielraum erstellen
                </button>

            </section>

            <section class="room-browser">

                <div class="room-browser-heading">
                    <div>
                        <h2>Offene Spielräume</h2>

                        <p>
                            Wähle einen Raum aus,
                            um direkt beizutreten.
                        </p>
                    </div>

                    <button
                        id="refreshRoomsButton"
                        class="secondary-button compact-button"
                        type="button"
                        disabled>
                        Aktualisieren
                    </button>
                </div>

                <div
                    class="available-room-list"
                    id="availableRoomList">
                </div>

                <p
                    class="empty-room-message"
                    id="roomListStatus">

                    Räume werden geladen …

                </p>

            </section>

            <p id="firebaseStatus">
                Verbindung wird hergestellt …
            </p>

            <small class="app-version">
                Version 58
            </small>

        </section>

        <section
            class="panel"
            id="lobbyPanel"
            hidden>

            <h2>Warteraum</h2>

            <p
                class="active-room-name"
                id="activeRoomName">
            </p>

            <h3>Spieler</h3>

            <ul id="playerList"></ul>

            <p id="lobbyStatus"></p>

            <div
                id="hostControls"
                hidden>

                <button
                    id="prepareGameButton"
                    type="button">
                    Alle sind da – weiter
                </button>

            </div>

            <button
                id="leaveRoomButton"
                class="secondary-button"
                type="button">
                Raum verlassen
            </button>

        </section>

    </main>

    <script type="module">
        import("./lobby.js?v=58")
            .catch(error => {
                console.error(error);

                const status =
                    document.getElementById(
                        "firebaseStatus"
                    );

                if (status) {
                    status.textContent =
                        "Lobby konnte nicht geladen werden: " +
                        error.message;
                }
            });
    </script>

</body>
</html>

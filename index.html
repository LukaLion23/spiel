<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="darkreader-lock">

    <meta
        name="color-scheme"
        content="light">

    <meta
        name="supported-color-schemes"
        content="light">

    <meta
        name="theme-color"
        content="#082b26">

    <style>
        :root,
        html {
            color-scheme: only light !important;
            background-color: #082b26 !important;
        }
    </style>

    <script>
        document.documentElement.style.colorScheme =
            "only light";
    </script>

    <title>Kartenspiel – Spielräume</title>

    <link
        rel="stylesheet"
        href="./style.css?v=72">
    <link rel="stylesheet" href="./game-theme.css?v=72">
    <link rel="stylesheet" href="./table-layout.css?v=72">
</head>

<body class="entry-page">

    <header class="game-brand"><span class="brand-mark" aria-hidden="true">✦</span><div><h1>STICH</h1><span class="brand-caption">DEIN TISCH. DEIN SPIEL.</span></div></header>

    <main class="container">

        <section
            class="panel"
            id="entryPanel">

            <div class="lobby-art" aria-hidden="true"><span class="art-card art-red">7</span><span class="art-card art-blue">12</span><span class="art-card art-gold">20</span></div><p class="eyebrow">ZUSAMMEN SPIELEN</p><h2>Bereit für den nächsten Stich?</h2>

            <label for="playerName">
                Dein Name
            </label>

            <input
                id="playerName"
                type="text"
                maxlength="30"
                placeholder="Spielername"
                autocomplete="name">

            <section class="create-room-area">

                <h2>Neuen Tisch eröffnen</h2>

                <label for="roomName">
                    Name des Spielraums
                </label>

                <input
                    id="roomName"
                    type="text"
                    maxlength="40"
                    placeholder="Zum Beispiel: Freitagsspiel"
                    autocomplete="off">

                <button
                    id="createRoomButton"
                    type="button"
                    disabled>
                    Tisch eröffnen
                </button>

            </section>

            <section class="room-browser">

                <div class="room-browser-heading">
                    <div>
                        <h2>Wähle deinen Tisch</h2>

                        <p>
                            Wähle einen Raum aus,
                            um direkt beizutreten.
                        </p>
                    </div>

                    <button
                        id="refreshRoomsButton"
                        class="secondary-button compact-button"
                        type="button"
                        disabled>
                        Aktualisieren
                    </button>
                </div>

                <div
                    class="available-room-list"
                    id="availableRoomList">
                </div>

                <p
                    class="empty-room-message"
                    id="roomListStatus">

                    Räume werden geladen …

                </p>

            </section>

            <p id="firebaseStatus">
                Verbindung wird hergestellt …
            </p>

            <small class="app-version">
                Version 72
            </small>

        </section>

        <section
            class="panel"
            id="lobbyPanel"
            hidden>

            <h2>Warteraum</h2>

            <p
                class="active-room-name"
                id="activeRoomName">
            </p>

            <div
                class="master-welcome"
                id="masterWelcome"
                hidden>

                Willkommen Meister

            </div>

            <h3>Spieler</h3>

            <ul id="playerList"></ul>

            <p id="lobbyStatus"></p>

            <div class="lobby-actions">

                <div
                    id="hostControls"
                    hidden>

                    <button
                        id="prepareGameButton"
                        type="button">
                        Spiel starten
                    </button>

                </div>

                <button
                    id="leaveRoomButton"
                    class="secondary-button"
                    type="button">
                    Spiel verlassen
                </button>

            </div>

        </section>

    </main>

    <script type="module">
        import("./lobby.js?v=72")
            .catch(error => {
                console.error(error);

                const status =
                    document.getElementById(
                        "firebaseStatus"
                    );

                if (status) {
                    status.textContent =
                        "Lobby konnte nicht geladen werden: " +
                        error.message;
                }
            });
    </script>

    <script type="module" src="./table-ui.js?v=72"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Kartenspiel – Eintritt</title>

    <link
        rel="stylesheet"
        href="./style.css?v=50">
</head>

<body class="entry-page">

    <h1>Online-Kartenspiel</h1>

    <main class="container">

        <section
            class="panel"
            id="entryPanel">

            <h2>Spiel erstellen oder beitreten</h2>

            <label for="playerName">
                Dein Name
            </label>

            <input
                id="playerName"
                type="text"
                maxlength="30"
                placeholder="Spielername"
                autocomplete="off">

            <button
                id="createRoomButton"
                type="button"
                disabled>
                Neues Spiel erstellen
            </button>

            <div class="section-divider">
                oder
            </div>

            <label for="roomCodeInput">
                Spielcode
            </label>

            <input
                id="roomCodeInput"
                type="text"
                minlength="6"
                maxlength="6"
                placeholder="ABC123"
                autocomplete="off">

            <button
                id="joinRoomButton"
                type="button"
                disabled>
                Spiel beitreten
            </button>

            <p id="firebaseStatus">
                Verbindung wird hergestellt …
            </p>

        </section>

        <section
            class="panel"
            id="lobbyPanel"
            hidden>

            <h2>Warteraum</h2>

            <p id="activeRoomCode"></p>

            <h3>Spieler</h3>

            <ul id="playerList"></ul>

            <p id="lobbyStatus"></p>

            <div
                id="hostControls"
                hidden>

                <button
                    id="prepareGameButton"
                    type="button">
                    Alle sind da – weiter
                </button>

            </div>

            <button
                id="leaveRoomButton"
                class="secondary-button"
                type="button">
                Raum verlassen
            </button>

        </section>

    </main>

    <script type="module">
        import("./lobby.js?v=50")
            .catch(error => {
                console.error(error);

                const status =
                    document.getElementById(
                        "firebaseStatus"
                    );

                if (status) {
                    status.textContent =
                        "Lobby konnte nicht geladen werden: " +
                        error.message;
                }
            });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="color-scheme"
        content="light">

    <meta
        name="supported-color-schemes"
        content="light">

    <meta
        name="theme-color"
        content="#eef3f8">

    <style>
        :root,
        html {
            color-scheme: only light !important;
            background-color: #eef3f8 !important;
        }
    </style>

    <script>
        document.documentElement.style.colorScheme =
            "only light";
    </script>

    <title>Kartenspiel – Spiel</title>

    <link
        rel="stylesheet"
        href="./style.css?v=55">
</head>

<body class="game-page">

    <h1>Online-Kartenspiel</h1>

    <main class="container">

        <p
            class="page-error"
            id="pageError"
            hidden>
        </p>

        <section class="panel game-status-bar">

            <div>
                <span class="status-label">
                    Runde
                </span>

                <strong id="roundNumber">
                    –
                </strong>
            </div>

            <div>
                <span class="status-label">
                    Am Zug
                </span>

                <strong id="currentPlayer">
                    Wird geladen …
                </strong>
            </div>

        </section>

        <section class="panel">
            <h2>Tipps und Stiche</h2>

            <div id="playerOverview"></div>
        </section>

        <section
            class="panel trick-panel"
            id="trickPanel">

            <h2>Aktueller Stich</h2>

            <div
                class="played-cards"
                id="trickArea">

                <p>
                    Noch keine Karte gespielt.
                </p>

            </div>

            <p
                class="trick-winner"
                id="trickWinner">
            </p>
        </section>

        <section class="panel">
            <h2>Deine Karten</h2>

            <p id="handHint"></p>

            <div
                class="cards-grid"
                id="handArea">
            </div>
        </section>

    </main>

    <div
        class="result-overlay"
        id="resultOverlay"
        hidden>

        <div class="result-dialog">

            <div class="result-icon">
                ✓
            </div>

            <h2>Runde beendet</h2>

            <p>
                Dein Tipp:
                <strong id="resultTip">0</strong>
            </p>

            <p>
                Geschaffte Stiche:
                <strong id="resultTricks">0</strong>
            </p>

            <p class="result-points">
                Rundenpunkte:
                <strong id="resultPoints">0</strong>
            </p>

            <p>
                Gesamtpunkte:
                <strong id="resultTotal">0</strong>
            </p>

            <p class="countdown-text">
                Nächste Runde in
                <strong id="resultCountdown">7</strong>
                Sekunden …
            </p>

        </div>

    </div>

    <script type="module">
        import("./game.js?v=55")
            .catch(error => {
                console.error(error);

                const errorElement =
                    document.getElementById(
                        "pageError"
                    );

                errorElement.hidden = false;
                errorElement.textContent =
                    "Spielseite konnte nicht geladen werden: " +
                    error.message;
            });
    </script>

</body>
</html>

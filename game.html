<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Kartenspiel – Spiel</title>

    <link
        rel="stylesheet"
        href="./style.css?v=40">
</head>

<body>

    <h1>Online-Kartenspiel</h1>

    <main class="container">

        <section class="panel game-status-bar">

            <div>
                <span class="status-label">
                    Runde
                </span>

                <strong id="roundNumber">
                    –
                </strong>
            </div>

            <div>
                <span class="status-label">
                    Am Zug
                </span>

                <strong id="currentPlayer">
                    Wird geladen …
                </strong>
            </div>

            <div>
                <span class="status-label">
                    Stichfarbe
                </span>

                <strong id="leadColor">
                    –
                </strong>
            </div>

        </section>

        <section class="panel">
            <h2>Tipps und Stiche</h2>

            <div id="playerOverview"></div>
        </section>

        <section class="panel">
            <h2>Aktueller Stich</h2>

            <div
                class="played-cards"
                id="trickArea">

                <p>
                    Noch keine Karte gespielt.
                </p>

            </div>

            <p
                class="trick-winner"
                id="trickWinner">
            </p>
        </section>

        <section class="panel">
            <h2>Deine Karten</h2>

            <p id="handHint"></p>

            <div
                class="cards-grid"
                id="handArea">
            </div>
        </section>

        <p
            id="firebaseStatus"
            class="connection-status">

            Spiel wird geladen …

        </p>

    </main>

    <div
        class="result-overlay"
        id="resultOverlay"
        hidden>

        <div class="result-dialog">

            <div class="result-icon">
                ✓
            </div>

            <h2>Runde beendet</h2>

            <p>
                Dein Tipp:
                <strong id="resultTip">0</strong>
            </p>

            <p>
                Geschaffte Stiche:
                <strong id="resultTricks">0</strong>
            </p>

            <p class="result-points">
                Rundenpunkte:
                <strong id="resultPoints">0</strong>
            </p>

            <p>
                Gesamtpunkte:
                <strong id="resultTotal">0</strong>
            </p>

            <p class="countdown-text">
                Nächste Runde in
                <strong id="resultCountdown">5</strong>
                Sekunden …
            </p>

        </div>

    </div>

    <script type="module">
        import("./game.js?v=40")
            .catch(error => {
                console.error(error);

                document.getElementById(
                    "firebaseStatus"
                ).textContent =
                    "Spielseite konnte nicht geladen werden: " +
                    error.message;
            });
    </script>

</body>
</html>

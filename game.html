<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="darkreader-lock">

    <meta
        name="color-scheme"
        content="light">

    <meta
        name="supported-color-schemes"
        content="light">

    <meta
        name="theme-color"
        content="#082b26">

    <style>
        :root,
        html {
            color-scheme: only light !important;
            background-color: #082b26 !important;
        }
    </style>

    <script>
        document.documentElement.style.colorScheme =
            "only light";
    </script>

    <title>Bappo – Spiel</title>

    <link
        rel="stylesheet"
        href="./style.css?v=75">
    <link rel="stylesheet" href="./game-theme.css?v=75">
    <link rel="stylesheet" href="./table-layout.css?v=75">
</head>

<body class="game-page">

    <header class="game-brand"><span class="brand-mark" aria-hidden="true">✦</span><div><h1>BAPPO</h1><span class="brand-caption">DEIN TISCH. DEIN SPIEL.</span></div></header>

    <main class="container">

        <p
            class="page-error"
            id="pageError"
            hidden>
        </p>

        <section class="panel game-status-bar">

            <div>
                <span class="status-label">
                    Runde
                </span>

                <strong id="roundNumber">
                    –
                </strong>
            </div>

            <div>
                <span class="status-label">
                    Am Zug
                </span>

                <strong id="currentPlayer">
                    Wird geladen …
                </strong>
            </div>

        </section>

        <section class="panel opponents-panel">
            <h2>Tipps und Stiche</h2>

            <div id="playerOverview"></div>
        </section>

        <section
            class="panel trick-panel"
            id="trickPanel">



            <div
                class="played-cards"
                id="trickArea">

                <p>
                    Noch keine Karte gespielt.
                </p>

            </div>

            <p
                class="trick-winner"
                id="trickWinner">
            </p>
        </section>

        <section class="panel hand-panel">
            <h2>Deine Karten</h2>

            <p id="handHint"></p>

            <div
                class="cards-grid"
                id="handArea">
            </div>
        </section>

    </main>

    <div
        class="result-overlay"
        id="resultOverlay"
        hidden>

        <div class="result-dialog" role="status" aria-live="polite">
            <h2>Runde beendet</h2>
            <div class="simple-result-row"><span>Dein Tipp</span><strong id="resultTip">0</strong></div>
            <div class="simple-result-row"><span>Geschaffte Stiche</span><strong id="resultTricks">0</strong></div>
            <div class="simple-result-row result-points"><span>Rundenpunkte</span><strong id="resultPoints">0</strong></div>
            <div class="simple-result-row"><span>Gesamtpunkte</span><strong id="resultTotal">0</strong></div>
            <p class="countdown-text">Nächste Runde in <strong id="resultCountdown">7</strong> Sekunden</p>
        </div>
    </div>

    <script type="module">
        import("./game.js?v=75")
            .catch(error => {
                console.error(error);

                const errorElement =
                    document.getElementById(
                        "pageError"
                    );

                errorElement.hidden = false;
                errorElement.textContent =
                    "Spielseite konnte nicht geladen werden: " +
                    error.message;
            });
    </script>

    <script type="module" src="./table-ui.js?v=75"></script>
</body>
</html>
